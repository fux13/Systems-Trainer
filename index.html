<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#06121d"><title>King Air 350 Systems Trainer</title><style>
:root{--bg:#06121d;--card:#0c1c2a;--card2:#102638;--line:#27455c;--txt:#eef6fb;--muted:#89a6b9;--cyan:#39bff5;--green:#37e38d;--amber:#ffc857;--red:#ff6675;--blue:#4aa8ff}*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#04101a,#091826);color:var(--txt);font:14px system-ui,Segoe UI,sans-serif}button{font:inherit}.top{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid var(--line);background:#071520ed;position:sticky;top:0;z-index:20;backdrop-filter:blur(10px)}.brand{font-weight:900;font-size:18px}.brand small{display:block;color:var(--muted);font-size:10px;font-weight:500}.topbtn{border:1px solid var(--line);background:#102232;color:#cce2ef;border-radius:9px;padding:8px 11px}.shell{display:grid;grid-template-columns:278px 1fr;min-height:calc(100vh - 64px)}.sidebar{border-right:1px solid var(--line);background:#071723;padding:13px;overflow:auto;height:calc(100vh - 64px);position:sticky;top:64px}.search{width:100%;background:#0c2030;border:1px solid var(--line);color:#fff;border-radius:9px;padding:10px;margin-bottom:10px}.chapter{width:100%;display:grid;grid-template-columns:35px 1fr auto;gap:8px;align-items:center;text-align:left;background:transparent;border:0;border-radius:9px;color:#bdd0dc;padding:8px;cursor:pointer}.chapter:hover,.chapter.active{background:#102b3e;color:#fff}.num{width:31px;height:31px;border-radius:8px;background:#132d40;display:grid;place-items:center;font-weight:800;color:#70d5ff}.chapter.active .num{background:#1776a0;color:#fff}.chapter small{display:block;color:#7895a8}.badge{font-size:9px;border:1px solid #2c5870;border-radius:5px;padding:2px 4px;color:#77d8ff}.main{padding:18px;min-width:0}.hero{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}.hero h1{font-size:26px;margin:0 0 4px}.desc{color:var(--muted);max-width:740px}.modes{display:flex;gap:7px;flex-wrap:wrap;margin:16px 0}.mode{border:1px solid var(--line);color:#bcd1dd;background:#0a1a27;border-radius:21px;padding:8px 13px;cursor:pointer}.mode.active{border-color:var(--cyan);background:#103149;color:#fff}.workspace{display:grid;grid-template-columns:minmax(0,1fr) 315px;gap:14px}.panel{background:linear-gradient(145deg,#0d1e2d,#091722);border:1px solid var(--line);border-radius:15px;padding:14px}.visual{min-height:560px;overflow:auto}.controls{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}.switch{border:1px solid #35586e;background:#102436;color:#d8e9f2;border-radius:8px;padding:8px 11px;font-weight:750}.switch.on{border-color:var(--green);box-shadow:0 0 9px #37e38d33}.schematic{position:relative;width:690px;height:500px;margin:auto;background:radial-gradient(ellipse at center,#17324677,transparent 68%)}.plane .fus{position:absolute;left:292px;top:24px;width:106px;height:445px;background:#526b7c55;clip-path:polygon(43% 0,57% 0,78% 8%,89% 78%,70% 96%,57% 100%,43% 100%,30% 96%,11% 78%,22% 8%)}.plane .wing{position:absolute;left:55px;top:180px;width:580px;height:125px;background:#617b8c55;clip-path:polygon(0 54%,42% 16%,58% 16%,100% 54%,100% 76%,58% 56%,42% 56%,0 76%)}.plane .tail{position:absolute;left:225px;top:399px;width:240px;height:65px;background:#617b8c55;clip-path:polygon(0 60%,43% 16%,57% 16%,100% 60%,100% 78%,57% 60%,43% 60%,0 78%)}.node{position:absolute;z-index:5;min-width:105px;text-align:center;border:2px solid #526879;background:#081824ee;border-radius:8px;padding:8px;font-weight:800;cursor:pointer}.node small{display:block;color:#8eabbc;font-size:9px;font-weight:500}.node.live{border-color:var(--green);box-shadow:0 0 10px #37e38d55}.node.fuel{border-color:var(--blue)}.node.pneu{border-color:#c58cff}.wire{position:absolute;z-index:3;background:#526576;border-radius:4px}.wire.live{background:var(--green);box-shadow:0 0 8px #37e38d}.wire.fuel{background:var(--blue);box-shadow:0 0 7px #4aa8ff88}.wire.pneu{background:#c58cff}.v{width:4px}.h{height:4px}.side h3{margin:4px 0 10px;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:#93adbd}.info{border:1px solid #28516a;background:#0a2030;border-radius:10px;padding:11px;margin-bottom:10px}.list{max-height:305px;overflow:auto}.row{padding:8px 2px;border-bottom:1px solid #183348}.row b{display:block}.row small{color:var(--muted)}.source{font-size:10px;color:#7897aa;line-height:1.5}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:11px}.card{border:1px solid var(--line);background:#0b1c29;border-radius:12px;padding:13px}.card h3{margin:0 0 7px}.card p{color:var(--muted);font-size:12px}.progress{height:5px;background:#163145;border-radius:4px;overflow:hidden}.progress i{display:block;height:100%;background:var(--cyan);width:0}.question{font-size:19px;font-weight:800;margin:12px 0}.answers{display:grid;gap:8px}.answer{border:1px solid var(--line);background:#0b1c29;color:#dcebf3;border-radius:9px;padding:11px;text-align:left}.answer.correct{border-color:var(--green)}.offline{border:1px solid #2d5168;border-radius:9px;padding:8px;color:#91acbd;font-size:11px}@media(max-width:920px){.shell{grid-template-columns:1fr}.sidebar{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);display:flex;overflow:auto}.sidebar .search{display:none}.chapter{min-width:190px}.workspace{grid-template-columns:1fr}.schematic{transform-origin:top left}.visual{overflow:auto}}@media(max-width:600px){.main{padding:12px}.hero{display:block}.schematic{transform:scale(.77);margin-bottom:-110px}.sidebar{padding:8px}.chapter{min-width:160px}.chapter small{display:none}}
</style></head><body><header class="top"><div class="brand">KING AIR 350<small>INTERACTIVE SYSTEMS TRAINER • PTM STRUCTURE</small></div><button class="topbtn" id="reset">Reset progress</button></header><div class="shell"><nav class="sidebar"><input class="search" id="search" placeholder="Kapitel suchen…"><div id="chapters"></div></nav><main class="main"><div id="app"></div></main></div><script>
const chapters=[['1','Aircraft General'],['2','Electrical Power Systems'],['3','Lighting'],['4','Master Warning System'],['5','Fuel System'],['6','Auxiliary Power Systems'],['7','Powerplant'],['8','Fire Protection'],['9','Pneumatics'],['10','Ice and Rain Protection'],['11','Air Conditioning'],['12','Pressurization'],['13','Hydraulic Power Systems'],['14','Landing Gear and Brakes'],['15','Flight Controls'],['16','Avionics'],['17','Oxygen System'],['18','Maneuvers and Procedures']];
const sourceNote='Sources used: user-provided KA35F PTM 350/360, FCS B350 eQRH, KA35F AFM and D-CFME POH/AFM only.';
let state={chapter:'2',mode:'learn',lg:true,rg:true,tie:true,bat:true,ext:false,lp:true,rp:true,xf:false,lb:true,rb:true};
const details={lbus:['Pilot PFD Heater — RH-G-11','LGEN — RH-C-9','L GEN Avionics Bus — RH-D-10','Bus Tie Power — RH-G-1','Flap Motor — RH-C-2'],rbus:['TAWS — RH-E-11','Copilot PFD Heater — RH-H-10','R GEN Avionics Bus — RH-E-10','Pitch Trim — RH-D-3'],triple:['Autofeather — RH-A-5','Start Control — RH-A-6 / RH-B-6','Fire Detect — RH-A-10 / RH-B-10','Press Control — RH-F-4','Standby Pumps — LH-A-3 / LH-A-13','Crossfeed — LH-A-8','Landing Gear Control — Gear Panel'],battery:['Battery Relay — LH-C-6','Battery Bus Control — LH-C-7','Ground Com — LH-C-4','Ground Heat — LH-C-8'],fuel:['Main and auxiliary wing tank system','Nacelle tank and engine supply path','Jet transfer pump','Standby boost pump','Firewall shutoff valve','Crossfeed valve'],pneu:['Engine P3 air','18 PSI regulated air','Pneumatic manifold','Surface deice','Brake deice','Vacuum ejector','Pressurization and door seal users']};
const moduleMap={'2':'electrical','5':'fuel','9':'pneumatic'};
function renderNav(filter=''){chaptersEl.innerHTML=chapters.filter(c=>c[1].toLowerCase().includes(filter.toLowerCase())).map(c=>`<button class="chapter ${state.chapter===c[0]?'active':''}" data-c="${c[0]}"><span class="num">${c[0]}</span><span>${c[1]}<small>PTM Chapter ${c[0]}</small></span>${moduleMap[c[0]]?'<span class="badge">LIVE</span>':''}</button>`).join('');document.querySelectorAll('.chapter').forEach(b=>b.onclick=()=>{state.chapter=b.dataset.c;state.mode='learn';render()})}
const chaptersEl=document.getElementById('chapters');document.getElementById('search').oninput=e=>renderNav(e.target.value);document.getElementById('reset').onclick=()=>{localStorage.removeItem('ka350progress');location.reload()};
function header(title,desc){return `<div class="hero"><div><h1>Chapter ${state.chapter}: ${title}</h1><div class="desc">${desc}</div></div><div class="offline">✓ Offline ready<br>Training use only</div></div><div class="modes">${['learn','explore','failure','quiz'].map(x=>`<button class="mode ${state.mode===x?'active':''}" data-m="${x}">${{learn:'📖 Learn',explore:'⚙ Explore',failure:'⚠ Failure',quiz:'🎓 Quiz'}[x]}</button>`).join('')}</div>`}
function attachModes(){document.querySelectorAll('.mode').forEach(b=>b.onclick=()=>{state.mode=b.dataset.m;render()})}
function electrical(){if(state.mode==='quiz')return quiz('Electrical Power Systems','Which source is physically located at each engine?',['Starter/Generator','Battery Bus','External Power Receptacle'],0);let fail=state.mode==='failure';return `${header('Electrical Power Systems','Interaktive PTM-Systemansicht mit Quellen, Generatorbussen, Tie-Logik und Detaildaten aus eQRH.')}
<div class="workspace"><section class="panel visual"><div class="controls">${[['lg','L GEN'],['rg','R GEN'],['tie','GEN TIE'],['bat','BAT'],['ext','EXT PWR']].map(x=>`<button class="switch ${state[x[0]]?'on':''}" data-s="${x[0]}">${x[1]}: ${state[x[0]]?'ON':'OFF'}</button>`).join('')}${fail?'<button class="switch" id="dualFail">Inject dual generator failure</button>':''}</div><div class="schematic"><div class="plane"><div class="fus"></div><div class="wing"></div><div class="tail"></div></div><div class="node ${state.lg?'live':''}" style="left:90px;top:137px">L STARTER/GEN<small>LEFT ENGINE</small></div><div class="node ${state.rg?'live':''}" style="right:90px;top:137px">R STARTER/GEN<small>RIGHT ENGINE</small></div><div class="wire v ${state.lg?'live':''}" style="left:148px;top:180px;height:80px"></div><div class="wire v ${state.rg?'live':''}" style="right:148px;top:180px;height:80px"></div><div class="node live pick" data-d="lbus" style="left:95px;top:260px">LEFT GEN BUS</div><div class="node live pick" data-d="rbus" style="right:95px;top:260px">RIGHT GEN BUS</div><div class="wire h ${state.tie?'live':''}" style="left:198px;top:280px;width:105px"></div><div class="wire h ${state.tie?'live':''}" style="right:198px;top:280px;width:105px"></div><div class="node ${state.tie?'live':''}" style="left:292px;top:260px">GEN TIE</div><div class="node live pick" data-d="triple" style="left:285px;top:335px;width:120px">TRIPLE-FED BUS</div><div class="node ${state.bat?'live':''}" style="left:440px;top:235px">BATTERY<small>RH engine/fuselage</small></div><div class="wire h ${state.bat?'live':''}" style="left:405px;top:257px;width:36px"></div><div class="node ${state.bat?'live':''} pick" data-d="battery" style="left:285px;top:405px;width:120px">BATTERY BUS</div></div></section><aside class="panel side"><h3>Selected component</h3><div class="info" id="selected">Tap a bus or component.</div><div class="list" id="detailList"></div><p class="source">${sourceNote}</p></aside></div>`}
function fuel(){if(state.mode==='quiz')return quiz('Fuel System','Which control connects the left and right engine supply paths?',['Crossfeed valve','Firewall shutoff valve','Jet transfer pump'],0);return `${header('Fuel System','PTM-based left/right fuel architecture with selectable standby pumps and crossfeed.')}
<div class="workspace"><section class="panel visual"><div class="controls">${[['lp','L STBY PUMP'],['rp','R STBY PUMP'],['xf','CROSSFEED']].map(x=>`<button class="switch ${state[x[0]]?'on':''}" data-s="${x[0]}">${x[1]}: ${state[x[0]]?'ON':'OFF'}</button>`).join('')}</div><div class="schematic"><div class="plane"><div class="fus"></div><div class="wing"></div><div class="tail"></div></div><div class="node fuel pick" data-d="fuel" style="left:38px;top:190px">L MAIN/AUX TANKS</div><div class="wire fuel h" style="left:145px;top:210px;width:92px"></div><div class="node fuel" style="left:235px;top:190px">L NACELLE TANK</div><div class="wire fuel h" style="left:340px;top:210px;width:50px"></div><div class="node fuel" style="left:390px;top:190px">L ENGINE</div><div class="node fuel pick" data-d="fuel" style="right:38px;top:310px">R MAIN/AUX TANKS</div><div class="wire fuel h" style="right:145px;top:330px;width:92px"></div><div class="node fuel" style="right:235px;top:310px">R NACELLE TANK</div><div class="wire fuel h" style="right:340px;top:330px;width:50px"></div><div class="node fuel" style="right:390px;top:310px">R ENGINE</div><div class="node ${state.xf?'live':''}" style="left:292px;top:260px">CROSSFEED<small>${state.xf?'OPEN':'CLOSED'}</small></div></div></section><aside class="panel side"><h3>Fuel system</h3><div class="info">Normal left/right supply paths remain separated. Crossfeed connects the engine supply sides when selected.</div><div class="list">${details.fuel.map(x=>`<div class="row">${x}</div>`).join('')}</div><p class="source">${sourceNote}</p></aside></div>`}
function pneumatic(){if(state.mode==='quiz')return quiz('Pneumatics','What is the pneumatic source identified in the PTM system overview?',['Engine P3 air','Battery bus','Motive fuel'],0);return `${header('Pneumatics','Engine P3 air and regulated pneumatic distribution to aircraft users.')}
<div class="workspace"><section class="panel visual"><div class="controls">${[['lb','L BLEED'],['rb','R BLEED']].map(x=>`<button class="switch ${state[x[0]]?'on':''}" data-s="${x[0]}">${x[1]}: ${state[x[0]]?'ON':'OFF'}</button>`).join('')}</div><div class="schematic"><div class="plane"><div class="fus"></div><div class="wing"></div><div class="tail"></div></div><div class="node pneu ${state.lb?'live':''}" style="left:80px;top:175px">L ENGINE P3 AIR</div><div class="wire pneu h" style="left:190px;top:197px;width:115px"></div><div class="node pneu pick" data-d="pneu" style="left:290px;top:175px">18 PSI REGULATOR</div><div class="wire pneu v" style="left:342px;top:217px;height:65px"></div><div class="node pneu ${state.rb?'live':''}" style="right:80px;top:315px">R ENGINE P3 AIR</div><div class="wire pneu h" style="right:190px;top:337px;width:115px"></div><div class="node pneu" style="left:290px;top:282px">PNEUMATIC MANIFOLD</div><div class="node pneu" style="left:90px;top:390px">DEICE USERS</div><div class="node pneu" style="left:290px;top:390px">PRESS / DOOR SEAL</div><div class="node pneu" style="right:90px;top:390px">VACUUM USERS</div></div></section><aside class="panel side"><h3>Pneumatic users</h3><div class="list">${details.pneu.map(x=>`<div class="row">${x}</div>`).join('')}</div><p class="source">${sourceNote}</p></aside></div>`}
function quiz(title,q,a,correct){return `${header(title,'Knowledge check created only from the provided manuals.')}<div class="panel"><div class="question">${q}</div><div class="answers">${a.map((x,i)=>`<button class="answer" data-a="${i}" data-c="${correct}">${x}</button>`).join('')}</div><div id="feedback" class="info" style="display:none;margin-top:12px"></div></div>`}
function library(title){return `${header(title,'Kapitel gemäß PTM-Struktur. Der Bereich ist navigierbar angelegt; interaktive Inhalte werden ausschließlich aus den bereitgestellten Unterlagen ergänzt.')}<div class="cards"><div class="card"><h3>📖 Learn</h3><p>Systembeschreibung und ausgewählte PTM-Unterthemen.</p><div class="progress"><i></i></div></div><div class="card"><h3>⚙ Explore</h3><p>Interaktive Darstellung nach Auswertung der zugehörigen PTM-Schematics.</p></div><div class="card"><h3>⚠ Failure</h3><p>Abnormal- und Failure-Logik nur, soweit durch eQRH, AFM oder POH belegt.</p></div><div class="card"><h3>🎓 Quiz</h3><p>Kapitelbezogene Wissensfragen ohne externe Inhalte.</p></div></div><div class="panel" style="margin-top:14px"><h3>Source-controlled module</h3><p class="desc">Dieses Modul enthält bewusst noch keine erfundenen Systemdetails. Es ist Teil der fertigen Kapitelnavigation und kann anschließend mit den entsprechenden PTM-Abbildungen und Texten befüllt werden.</p><p class="source">${sourceNote}</p></div>`}
function render(){renderNav();let c=chapters.find(x=>x[0]===state.chapter);let html=state.chapter==='2'?electrical():state.chapter==='5'?fuel():state.chapter==='9'?pneumatic():library(c[1]);document.getElementById('app').innerHTML=html;attachModes();document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{state[b.dataset.s]=!state[b.dataset.s];render()});document.querySelectorAll('.pick').forEach(x=>x.onclick=()=>{let arr=details[x.dataset.d]||[];let s=document.getElementById('selected');if(s)s.innerHTML='<b>'+x.textContent.trim()+'</b>';let l=document.getElementById('detailList');if(l)l.innerHTML=arr.map(y=>`<div class="row">${y}</div>`).join('')});let df=document.getElementById('dualFail');if(df)df.onclick=()=>{state.lg=false;state.rg=false;render()};document.querySelectorAll('.answer').forEach(b=>b.onclick=()=>{let ok=+b.dataset.a===+b.dataset.c;b.classList.toggle('correct',ok);let f=document.getElementById('feedback');f.style.display='block';f.textContent=ok?'Correct.':'Not correct. Review the Learn mode and try again.'});localStorage.setItem('ka350progress',JSON.stringify({chapter:state.chapter,mode:state.mode}))}try{Object.assign(state,JSON.parse(localStorage.getItem('ka350progress')||'{}'))}catch(e){}render();
</script></body></html>
